 $('loadMore').textContent=l.load;
 for(let i=1;i<$('months').options.length;i++)$('months').options[i].text=new Date(2026,i-1,1).toLocaleDateString(locales[lang],{month:'long'});
 try{sessionStorage.setItem('retrophoneLang',lang)}catch(e){}
 render();
}
function render(){
 const groups=new Map();
 for(const p of items){
  const dt=new Date(p.published_at);if(isNaN(dt.getTime()))continue;
  const dateParts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Yerevan',year:'numeric',month:'numeric'}).formatToParts(dt);
  const yr=dateParts.find(x=>x.type==='year').value,mo=dateParts.find(x=>x.type==='month').value;
  if(selectedYear!=='all'&&yr!==selectedYear||selectedMonth!=='all'&&mo!==selectedMonth)continue;
  if(search&&!([p.title_ru,p.title_hy,p.title_en,p.excerpt_ru,p.excerpt_hy,p.excerpt_en].join(' ').toLocaleLowerCase().includes(search)))continue;
  const k=yr+'-'+mo.padStart(2,'0');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p);
 }
 const root=$('monthsResults');root.replaceChildren();let total=0;
 for(const [period,posts] of [...groups.entries()].sort((a,b)=>b[0].localeCompare(a[0]))){
  total+=posts.length;
  const section=el('section','archive-month');section.append(el('h2','',new Date(period+'-01T00:00:00Z').toLocaleDateString(locales[lang],{month:'long',year:'numeric'})));
  const list=el('div','archive-list');
  for(const p of posts){
   const card=el('article','archive-news');
   const photo=document.createElement('div');if(p.image_url){const img=el('img');img.src=p.image_url;img.alt=p['image_caption_'+lang]||p.image_caption_ru||'';img.loading='lazy';img.onerror=()=>img.remove();photo.append(img)}
   const info=el('div');info.append(el('small','',localDate(p.source_published_at)+' · '+p.source_name));
   const header=el('h3'),a=el('a','',title(p));a.href='/news/?post='+encodeURIComponent(p.slug)+'&lang='+lang;header.append(a);info.append(header,el('p','',excerpt(p)));card.append(photo,info);list.append(card)
  }
  section.append(list);root.append(section);
 }
 $('archiveCount').textContent=total+' · '+tr[lang].total;
 if(!total)root.append(el('div','status',tr[lang].empty));
}
function updateYears(){
 const s=$('years'),prev=s.value;s.replaceChildren();const all=el('option','','');all.value='all';s.append(all);
 const years=[...new Set(items.map(p=>Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Yerevan',year:'numeric'}).format(new Date(p.published_at)))))].filter(Number.isFinite).sort((a,b)=>b-a);
 for(const yr of years){const o=el('option','',String(yr));o.value=String(yr);s.append(o)}s.value=[...s.options].some(o=>o.value===prev)?prev:'all';
}
async function loadMore(){
 const btn=$('loadMore');btn.disabled=true;
 try{
  const res=await fetch('/api/retro-news?limit=100&offset='+items.length,{cache:'no-store'});if(!res.ok)throw Error('News unavailable');
  const data=await res.json();if(!data.ok||!Array.isArray(data.items))throw Error('Invalid response');
  for(const p of data.items)if(!items.some(x=>x.id===p.id))items.push(p);
  updateYears();render();btn.classList.toggle('hidden',data.items.length<100);
 }catch(e){$('archiveCount').textContent='Archive unavailable. Refresh this page.'}
 finally{btn.disabled=false}
}
document.querySelectorAll('.langbtn').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
$('years').addEventListener('change',e=>{selectedYear=e.target.value;render()});
$('months').addEventListener('change',e=>{selectedMonth=e.target.value;render()});
$('archiveSearch').addEventListener('input',e=>{search=String(e.target.value||'').trim().toLocaleLowerCase();render()});
$('loadMore').addEventListener('click',loadMore);
setLang(lang);loadMore();
})();
</script></body></html>
