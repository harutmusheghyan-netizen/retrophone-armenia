name: RetroPhone all existing admin data QA
on:
  push:
    branches:
      - fix/admin-all-sections-existing-data-20261108
    paths:
      - 'review/unified-admin-20261108/**'
      - 'scripts/check-admin-all-existing-sections.mjs'
      - '.github/workflows/admin-all-existing-data-qa.yml'
  pull_request:
    branches:
      - backup/admin-panel-etalon-v2-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-all-original-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify original source data, all-section editor and desktop/mobile
        run: |
          node --check review/unified-admin-20261108/admin-unified.js
          node scripts/check-admin-all-existing-sections.mjs
          node scripts/check-unified-admin.mjs
          node scripts/check-about-original-prefill.mjs
